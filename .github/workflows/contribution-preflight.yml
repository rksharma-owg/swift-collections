name: Contribution preflight
permissions:
  contents: read
jobs:
  tests:
    name: Test
    uses: rksharma-owg/swift-collections/.github/workflows/fork-package.yml@main
    with:
      enable_macos_checks: true
      macos_exclude_xcode_versions: '[{"xcode_version": "swift_6.1"}]'
      linux_exclude_swift_versions: '[{"swift_version": "5.9"}, {"swift_version": "5.10"}, {"swift_version": 6.0}, {"swift_version":
        6.1}]'
      windows_exclude_swift_versions: '[{"swift_version": "5.9"}, {"swift_version": 6.0}, {"swift_version": 6.1}]'
      enable_wasm_sdk_build: true
      enable_android_sdk_build: true
      enable_android_sdk_checks: true
      enable_freebsd_checks: true
    steps: []
  containers-tests:
    name: Containers Test
    uses: rksharma-owg/swift-collections/.github/workflows/fork-package.yml@main
    with:
      linux_swift_versions: '["6.2", "nightly-main"]'
      enable_macos_checks: false
      enable_linux_checks: true
      enable_windows_checks: false
      swift_flags: --traits UnstableContainersPreview
    steps: []
  hashed-containers-tests:
    name: Hashed Containers Test
    uses: rksharma-owg/swift-collections/.github/workflows/fork-package.yml@main
    with:
      linux_swift_versions: '["6.2", "nightly-main"]'
      enable_macos_checks: false
      enable_linux_checks: true
      enable_windows_checks: false
      swift_flags: --traits UnstableHashedContainers
    steps: []
  all-traits-tests:
    name: All Unstable Package Traits Test
    uses: rksharma-owg/swift-collections/.github/workflows/fork-package.yml@main
    with:
      linux_swift_versions: '["6.2", "6.3", "nightly-6.4.x", "nightly-main"]'
      enable_macos_checks: false
      enable_linux_checks: true
      enable_windows_checks: false
      swift_flags: --traits UnstableHashedContainers,UnstableContainersPreview,UnstableSortedCollections
    steps: []
  embedded-swift:
    name: Build with Embedded Swift
    uses: rksharma-owg/swift-collections/.github/workflows/fork-package.yml@main
    with:
      enable_linux_checks: false
      enable_macos_checks: false
      enable_windows_checks: false
      enable_wasm_sdk_build: false
      enable_embedded_wasm_sdk_build: true
      swift_flags: --target Collections
    steps: []
  soundness:
    name: Soundness
    uses: rksharma-owg/swift-collections/.github/workflows/fork-soundness.yml@main
    with:
      license_header_check_project_name: Swift.org
      python_lint_check_enabled: false
      docs_check_enabled: false
      shell_check_enabled: false
      format_check_enabled: false
      api_breakage_check_enabled: false
      api_breakage_check_baseline: ${{ inputs.base_sha }}
    steps: []
  cmake-build:
    name: CMake Build
    runs-on: ubuntu-latest
    container:
      image: swiftlang/swift:nightly-main-jammy
    steps:
    - name: Checkout repo
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event.inputs.patch_sha }}
        fetch-depth: 0
        persist-credentials: false
    - name: Verify exact patch and baseline
      shell: bash
      env:
        PATCH_SHA: ${{ github.event.inputs.patch_sha }}
        BASE_SHA: ${{ github.event.inputs.base_sha }}
      run: 'set -euo pipefail

        git config --global --add safe.directory "$GITHUB_WORKSPACE"

        test "$(git rev-parse HEAD)" = "$PATCH_SHA"

        git merge-base --is-ancestor "$BASE_SHA" HEAD

        git log -1 --format=fuller

        printf ''Baseline: %s\n'' "$BASE_SHA"'
    - name: Install apt dependencies
      run: apt-get -qq update && apt-get -qq -y install curl ninja-build
    - name: Install CMake
      id: install-cmake
      uses: swiftlang/github-workflows/.github/actions/install-cmake@0.0.15
      with:
        cmake-version: 3.30.2
        hash: cdd7fb352605cee3ae53b0e18b5929b642900e33d6b0173e19f6d4f2067ebf16
    - name: CMake version
      shell: bash
      env:
        CMAKE: ${{ steps.install-cmake.outputs.cmake }}
      run: '"$CMAKE" --version

        '
    - name: Configure with CMake
      shell: bash
      env:
        CMAKE: ${{ steps.install-cmake.outputs.cmake }}
      run: '"$CMAKE" -G Ninja -S . -B .cmake-build

        '
    - name: Build with CMake
      shell: bash
      env:
        CMAKE: ${{ steps.install-cmake.outputs.cmake }}
      run: '"$CMAKE" --build .cmake-build

        '
  xcode-build:
    name: Xcode Project Build
    runs-on: xcode-27
    steps:
    - name: Checkout repo
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event.inputs.patch_sha }}
        fetch-depth: 0
        persist-credentials: false
    - name: Verify exact patch and baseline
      shell: bash
      env:
        PATCH_SHA: ${{ github.event.inputs.patch_sha }}
        BASE_SHA: ${{ github.event.inputs.base_sha }}
      run: 'set -euo pipefail

        git config --global --add safe.directory "$GITHUB_WORKSPACE"

        test "$(git rev-parse HEAD)" = "$PATCH_SHA"

        git merge-base --is-ancestor "$BASE_SHA" HEAD

        git log -1 --format=fuller

        printf ''Baseline: %s\n'' "$BASE_SHA"'
    - name: Select installed Swift6.4 Xcode
      shell: bash
      env:
        EXPECTED_VERSION: swift_6.4
      run: "set -euo pipefail\nexpected=\"${EXPECTED_VERSION#swift_}\"\nselected=\"\"\nfor app in /Applications/Xcode*.app;\
        \ do\n  [ -d \"$app/Contents/Developer\" ] || continue\n  version=$(DEVELOPER_DIR=\"$app/Contents/Developer\" xcrun\
        \ swift --version)\n  if [[ \"$version\" =~ Swift\\ version\\ $expected([.\\ ]|$) ]]; then selected=\"$app\"; fi\n\
        done\n[ -n \"$selected\" ] || { echo \"Required Xcode unavailable: $expected\" >&2; exit 1; }\necho \"DEVELOPER_DIR=$selected/Contents/Developer\"\
        \ >> \"$GITHUB_ENV\"\nDEVELOPER_DIR=\"$selected/Contents/Developer\" xcrun swift --version"
    - name: Xcode version
      run: xcrun xcodebuild -version
    - name: Swift version
      run: xcrun swift --version
    - name: Build Collections
      run: xcrun xcodebuild -project Xcode/Collections.xcodeproj -scheme Collections
    - name: Build ContainersPreview
      run: xcrun xcodebuild -project Xcode/Collections.xcodeproj -scheme ContainersPreview
'on':
  workflow_dispatch:
    inputs:
      patch_sha:
        type: string
        required: true
      base_sha:
        type: string
        required: true
